spring:
  application:
    name: LanceOS

  # Database Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Flyway Configuration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # OAuth2 Configuration
  # Note: OAuth2 is disabled by default. To enable, set GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET
  # security:
  #   oauth2:
  #     client:
  #       registration:
  #         google:
  #           client-id: ${GOOGLE_CLIENT_ID:your-client-id}
  #           client-secret: ${GOOGLE_CLIENT_SECRET:your-client-secret}
  #           scope:
  #             - email
  #             - profile
  #       provider:
  #         google:
  #           authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
  #           token-uri: https://oauth2.googleapis.com/token
  #           user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo

# Application Configuration
app:
  jwt:
    secret: ${JWT_SECRET}
    access-expiration-ms: 5*60*1000 # 5 minutes
    refresh-expiration-ms: 7*24*60*60*1000 # 7 days
  
  oauth2:
    authorized-redirect-uris:
      - ${APP_FRONTEND_URL:http://localhost:5173}/oauth2/redirect
  
  cors:
    allowed-origins:
      - ${APP_FRONTEND_URL:http://localhost:5173}
      - http://localhost:3000
  
  ai-service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    timeout-seconds: 30
  
  scheduling:
    default-working-hours-per-day: 8
    default-start-hour: 9

# Server Configuration
server:
  port: ${SERVER_PORT:8080}

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# Logging
logging:
  level:
    root: INFO
    com.wziem.lancebackend: DEBUG

