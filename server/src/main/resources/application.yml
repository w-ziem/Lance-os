spring:
  application:
    name: LanceOS

  # Database Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Flyway Configuration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # CONFIG SMTP setup for passwordless login codes
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${MAIL_TIMEOUT_MS:5000}
          writetimeout: ${MAIL_WRITE_TIMEOUT_MS:5000}

  # OAuth2 Configuration
  security:
    oauth2:
      client:
        registration:
          google:
            # CONFIG set GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET with real values
            client-id: ${GOOGLE_CLIENT_ID:your-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-client-secret}
            scope:
              - email
              - profile
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo

# Application Configuration
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 300000 # 5 minutes
    refreshExpiration: 604800000 # 7 days

  auth:
    # CONFIG passwordless verification code generation
    code:
      length: ${AUTH_CODE_LENGTH:6}
      ttl-seconds: ${AUTH_CODE_TTL_SECONDS:600}
    mail:
      from: ${AUTH_MAIL_FROM:no-reply@lance.local}
      subject: ${AUTH_MAIL_SUBJECT:Your Lance login code}
    # CONFIG refresh token cookie behavior
    refresh-cookie:
      name: ${AUTH_REFRESH_COOKIE_NAME:refresh_token}
      path: ${AUTH_REFRESH_COOKIE_PATH:/auth}
      max-age-seconds: ${AUTH_REFRESH_COOKIE_MAX_AGE_SECONDS:604800}
      secure: ${AUTH_REFRESH_COOKIE_SECURE:false}
      same-site: ${AUTH_REFRESH_COOKIE_SAME_SITE:Lax}

  oauth2:
    # CONFIG frontend route used after successful OAuth2 login (without token in URL)
    frontend-callback-path: ${APP_OAUTH2_FRONTEND_CALLBACK_PATH:/oauth2/callback}

  # CONFIG calendar working hours and slot granularity.
  # Will be migrated to a per-user preference table later; for now global defaults.
  schedule:
    work-start-hour: ${APP_SCHEDULE_WORK_START_HOUR:8}
    work-end-hour:   ${APP_SCHEDULE_WORK_END_HOUR:17}
    slot-minutes:    ${APP_SCHEDULE_SLOT_MINUTES:30}

  ai-service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    timeout-seconds: 30


# Server Configuration
server:
  port: ${SERVER_PORT:8080}

client:
  url: ${APP_FRONTEND_URL:http://localhost:3000}
# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      enabled: false

# Logging
logging:
  level:
    root: INFO
    com.wziem.lancebackend: DEBUG

