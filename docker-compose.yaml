services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: lance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lance-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Backend
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: lance-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./server/.env
    ports: 
     - "8080:8080"
    environment:
      # CONFIG Docker network overrides host values from server/.env
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: postgres
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      # Server Configuration
      SERVER_PORT: 8080
      # CONFIG runtime app vars (JWT/OAuth2/SMTP/etc.) are loaded from env_file: ./server/.env
    networks:
      - lance-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 120s
      timeout: 10s
      retries: 3
      start_period: 60s

  # React Frontend
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
    container_name: lance-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - ./client/.env
    ports:
      # CONFIG host:container — nginx listens on 80 inside (see client/nginx.conf)
      - "3000:80"
    networks:
      - lance-network
    healthcheck:
      # CONFIG use IPv4 loopback to avoid localhost->IPv6 (::1) healthcheck failures in nginx container
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  lance-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
